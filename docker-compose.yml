
services:
  postgres:
    image: postgres:17
    container_name: mini-banking-postgres
    environment:
      POSTGRES_DB: mini_banking
      POSTGRES_USER: banking_user
      POSTGRES_PASSWORD: banking_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U banking_user -d mini_banking"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: